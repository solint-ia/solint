<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><style>
@keyframes sl-ringA{from{transform:rotateX(73deg) rotateZ(0deg)}to{transform:rotateX(73deg) rotateZ(360deg)}}
@keyframes sl-ringB{from{transform:rotateY(58deg) rotateX(70deg) rotateZ(360deg)}to{transform:rotateY(58deg) rotateX(70deg) rotateZ(0deg)}}
@keyframes sl-ringC{from{transform:rotateY(-56deg) rotateX(68deg) rotateZ(0deg)}to{transform:rotateY(-56deg) rotateX(68deg) rotateZ(360deg)}}
@keyframes sl-lattice{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes sl-lattice2{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes sl-pulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes sl-breathe{0%,100%{opacity:.35}50%{opacity:.7}}
@keyframes sl-float{0%,100%{transform:translate3d(0,0,0);opacity:.25}50%{transform:translate3d(0,-16px,0);opacity:.8}}
@keyframes sl-dash{to{stroke-dashoffset:-240}}
@media (prefers-reduced-motion: reduce){#sl-core *{animation:none !important}}
</style></helmet>
<div id="sl-core" aria-hidden="true" style="position:relative;width:100%;aspect-ratio:1/1;max-width:640px;margin:0 auto;pointer-events:none;user-select:none">
  <div ref="{{ tiltRef }}" style="position:absolute;inset:0;perspective:1100px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.22,.61,.36,1);will-change:transform">

    <div style="position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(22,140,255,.30) 0%, rgba(23,78,255,.12) 38%, rgba(5,10,20,0) 68%);filter:blur(6px);animation:sl-breathe 9s ease-in-out infinite"></div>

    <div style="position:absolute;inset:0;transform-style:preserve-3d">
      <div style="position:absolute;inset:6%;border-radius:50%;border:1px solid rgba(53,217,255,.20);transform-style:preserve-3d;animation:sl-ringA 34s linear infinite">
        <div style="position:absolute;left:calc(100% - 5px);top:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:#35D9FF;box-shadow:0 0 14px 3px rgba(53,217,255,.55)"></div>
        <div style="position:absolute;left:calc(6.7% - 4px);top:calc(75% - 4px);width:8px;height:8px;border-radius:50%;background:#168CFF;box-shadow:0 0 12px 3px rgba(22,140,255,.5)"></div>
        <div style="position:absolute;left:calc(25% - 3px);top:calc(6.7% - 3px);width:6px;height:6px;border-radius:50%;background:#9CD9FF;box-shadow:0 0 10px 2px rgba(156,217,255,.45)"></div>
      </div>

      <div style="position:absolute;inset:15%;border-radius:50%;border:1px solid rgba(22,140,255,.24);transform-style:preserve-3d;animation:sl-ringB 46s linear infinite">
        <div style="position:absolute;left:calc(50% - 5px);top:-5px;width:10px;height:10px;border-radius:50%;background:#35D9FF;box-shadow:0 0 14px 3px rgba(53,217,255,.5)"></div>
        <div style="position:absolute;left:calc(93.3% - 4px);top:calc(75% - 4px);width:8px;height:8px;border-radius:50%;background:#174EFF;box-shadow:0 0 12px 3px rgba(23,78,255,.55)"></div>
      </div>

      <div style="position:absolute;inset:24%;border-radius:50%;border:1px solid rgba(53,217,255,.16);transform-style:preserve-3d;animation:sl-ringC 27s linear infinite">
        <div style="position:absolute;left:calc(100% - 4px);top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:#8AE3FF;box-shadow:0 0 12px 3px rgba(138,227,255,.5)"></div>
        <div style="position:absolute;left:calc(0% - 3px);top:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:#168CFF;box-shadow:0 0 10px 2px rgba(22,140,255,.5)"></div>
      </div>
    </div>

    <svg viewBox="0 0 400 400" style="position:absolute;inset:18%;width:64%;height:64%;overflow:visible;animation:sl-lattice 60s linear infinite">
      <defs>
        <linearGradient id="slLat" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#35D9FF" stop-opacity=".85"></stop>
          <stop offset="100%" stop-color="#174EFF" stop-opacity=".35"></stop>
        </linearGradient>
      </defs>
      <g fill="none" stroke="url(#slLat)" stroke-width="1.1">
        <polygon points="200,40 338,120 338,280 200,360 62,280 62,120" stroke-opacity=".55"></polygon>
        <polygon points="200,90 320,200 200,310 80,200" stroke-opacity=".4"></polygon>
        <path d="M200,40 L200,360 M62,120 L338,280 M338,120 L62,280" stroke-opacity=".45"></path>
        <path d="M200,40 L338,280 L62,280 Z" stroke-opacity=".3"></path>
        <path d="M200,360 L62,120 L338,120 Z" stroke-opacity=".3"></path>
      </g>
      <g fill="#35D9FF">
        <circle cx="200" cy="40" r="3.2" opacity=".9"></circle>
        <circle cx="338" cy="120" r="2.6" opacity=".7"></circle>
        <circle cx="338" cy="280" r="2.6" opacity=".7"></circle>
        <circle cx="200" cy="360" r="3.2" opacity=".9"></circle>
        <circle cx="62" cy="280" r="2.6" opacity=".7"></circle>
        <circle cx="62" cy="120" r="2.6" opacity=".7"></circle>
      </g>
    </svg>

    <svg viewBox="0 0 400 400" style="position:absolute;inset:10%;width:80%;height:80%;overflow:visible;animation:sl-lattice2 90s linear infinite">
      <g fill="none" stroke="#35D9FF" stroke-width="1" stroke-opacity=".38" stroke-dasharray="6 10" style="animation:sl-dash 14s linear infinite">
        <circle cx="200" cy="200" r="192"></circle>
      </g>
    </svg>

    <div style="position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 46% 42%, #EAF6FF 0%, #6FD2FF 18%, #168CFF 44%, rgba(23,78,255,.25) 70%, rgba(5,10,20,0) 100%);filter:blur(1px);animation:sl-pulse 6.5s ease-in-out infinite"></div>
    <div style="position:absolute;left:50%;top:50%;width:9%;height:9%;transform:translate(-50%,-50%);border-radius:50%;background:#F2FAFF;box-shadow:0 0 40px 12px rgba(53,217,255,.55), 0 0 120px 40px rgba(22,140,255,.28)"></div>

    <div style="position:absolute;inset:0">
      <span style="position:absolute;left:12%;top:28%;width:3px;height:3px;border-radius:50%;background:#8AE3FF;animation:sl-float 11s ease-in-out infinite"></span>
      <span style="position:absolute;left:82%;top:22%;width:2px;height:2px;border-radius:50%;background:#8AE3FF;animation:sl-float 13s ease-in-out .8s infinite"></span>
      <span style="position:absolute;left:88%;top:64%;width:3px;height:3px;border-radius:50%;background:#5FB6FF;animation:sl-float 9s ease-in-out 1.6s infinite"></span>
      <span style="position:absolute;left:20%;top:78%;width:2px;height:2px;border-radius:50%;background:#8AE3FF;animation:sl-float 15s ease-in-out .4s infinite"></span>
      <span style="position:absolute;left:52%;top:8%;width:2px;height:2px;border-radius:50%;background:#B7E9FF;animation:sl-float 12s ease-in-out 2.2s infinite"></span>
      <span style="position:absolute;left:34%;top:92%;width:3px;height:3px;border-radius:50%;background:#5FB6FF;animation:sl-float 10s ease-in-out 1.1s infinite"></span>
      <span style="position:absolute;left:6%;top:52%;width:2px;height:2px;border-radius:50%;background:#8AE3FF;animation:sl-float 14s ease-in-out 3s infinite"></span>
      <span style="position:absolute;left:70%;top:88%;width:2px;height:2px;border-radius:50%;background:#B7E9FF;animation:sl-float 12.5s ease-in-out 1.9s infinite"></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:640}}">
class Component extends DCLogic {
  constructor(p){ super(p); this.tiltRef = React.createRef(); }
  componentDidMount(){
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    this.mx = 0; this.my = 0; this.sy = 0; this.raf = null;
    const apply = () => {
      this.raf = null;
      const el = this.tiltRef.current; if (!el) return;
      el.style.transform = 'rotateX(' + (this.my * -6 + this.sy * 3).toFixed(2) + 'deg) rotateY(' + (this.mx * 8).toFixed(2) + 'deg) translate3d(' + (this.mx * 10).toFixed(1) + 'px,' + (this.my * 8 - this.sy * 14).toFixed(1) + 'px,0)';
    };
    const schedule = () => { if (!this.raf) this.raf = requestAnimationFrame(apply); };
    this.onMove = (e) => {
      if (window.innerWidth < 900) return;
      this.mx = (e.clientX / window.innerWidth) * 2 - 1;
      this.my = (e.clientY / window.innerHeight) * 2 - 1;
      schedule();
    };
    this.onScroll = () => {
      const el = this.tiltRef.current; if (!el) return;
      const r = el.getBoundingClientRect();
      this.sy = Math.max(-1, Math.min(1, (r.top + r.height / 2 - window.innerHeight / 2) / window.innerHeight));
      schedule();
    };
    window.addEventListener('mousemove', this.onMove, { passive: true });
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }
  componentWillUnmount(){
    window.removeEventListener('mousemove', this.onMove);
    window.removeEventListener('scroll', this.onScroll);
    if (this.raf) cancelAnimationFrame(this.raf);
  }
  renderVals(){ return { tiltRef: this.tiltRef }; }
}
</script>
</body>
</html>
